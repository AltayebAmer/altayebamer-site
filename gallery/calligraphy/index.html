nav{position:fixed;top:0;left:0;right:0;z-index:700;padding:1.4rem 2rem;display:flex;align-items:center;justify-content:center;gap:1.6rem;background:linear-gradient(to bottom,rgba(5,5,4,.88)0%,transparent 100%);flex-wrap:wrap}

/* SPECIALTY HERO */
#shero{position:relative;height:62vh;min-height:380px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3.5rem}
#shero .slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;filter:grayscale(.55) brightness(.42);transition:opacity 1.8s ease}
#shero .slide.active{opacity:1}
#shero::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(5,5,4,.3)0%,rgba(5,5,4,.2)50%,rgba(5,5,4,.92)100%);pointer-events:none}
#shero-content{position:relative;z-index:2;text-align:center;padding:0 1.5rem}
#shero-tag{font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.3em;color:var(--acc);text-transform:uppercase;margin-bottom:.6rem}
#shero h1{font-size:clamp(2.3rem,5.5vw,4rem);font-weight:300;font-style:italic;color:var(--ivory)}
#shero p{font-family:'IBM Plex Arabic',sans-serif;font-size:1rem;color:rgba(200,169,110,.6);margin-top:.7rem}

/* QUOTE BREATH */
#breath{padding:4rem 2rem;text-align:center;position:relative;min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.q-item{position:absolute;max-width:680px;opacity:0;transform:translateY(8px);transition:opacity 1s ease,transform 1s ease;pointer-events:none}
.q-item.vis{position:relative;opacity:1;transform:translateY(0);pointer-events:auto}
.q-text{font-size:clamp(1.05rem,2vw,1.4rem);font-style:italic;font-weight:300;color:rgba(240,235,225,.78);line-height:1.85}
.q-text-ar{font-family:'IBM Plex Arabic',sans-serif;font-size:clamp(1rem,1.8vw,1.25rem);font-weight:200;color:rgba(240,235,225,.78);line-height:2;display:none}
[data-lang="ar"] .q-text{display:none}[data-lang="ar"] .q-text-ar{display:block}
.q-author{font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.2em;color:rgba(200,169,110,.55);text-transform:uppercase;margin-top:1rem;display:block}
.q-dots{display:flex;gap:.4rem;justify-content:center;margin-top:1.3rem}
.qdot{width:3px;height:3px;border-radius:50%;background:rgba(200,169,110,.2)}
.qdot.on{background:var(--acc)}

/* FILTER BAR */
#filter-bar{position:sticky;top:0;z-index:600;background:rgba(5,5,4,.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(200,169,110,.1);padding:1rem 2rem;display:flex;gap:.55rem;flex-wrap:wrap;justify-content:center}
.filter-btn{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;padding:.5rem 1.05rem;border-radius:999px;border:1px solid rgba(200,169,110,.25);background:transparent;color:var(--ivory2);cursor:pointer;transition:all .25s;white-space:nowrap}
.filter-btn:hover{border-color:var(--acc);color:var(--acc)}
.filter-btn.active{background:var(--acc);color:var(--void);border-color:var(--acc)}

.gsection{padding:3rem 2rem 1rem;max-width:1300px;margin:0 auto}
.gsection-head{display:flex;align-items:baseline;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap}
.gsection-num{font-size:1.3rem;color:var(--acc)}
.gsection-title-en{font-size:clamp(1.2rem,2.5vw,1.7rem);font-weight:300;font-style:italic}

.gsection-count{margin-right:auto;font-family:monospace;font-size:.7rem;color:var(--ivory2)}

.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem;margin-bottom:1.5rem}
.gitem{position:relative;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:#0a0a09}
.gitem img{width:100%;height:100%;object-fit:cover;filter:grayscale(.35) brightness(.8);transition:filter .4s ease,transform .4s ease}
.gitem:hover img{filter:grayscale(0) brightness(1);transform:scale(1.04)}

.gsection-more{display:flex;justify-content:center;margin-bottom:1rem}
.gsection-more button{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;padding:.6rem 1.6rem;border-radius:999px;border:1px solid rgba(200,169,110,.3);background:transparent;color:var(--ivory2);cursor:pointer;transition:.3s}

/* ═══ ARABIC TYPOGRAPHY FIX v2 ═══
   العربية خط متّصل: لا تباعد حروف، ولا Uppercase، وخط عربي حقيقي.
   الأرضية المطلقة max() تمنع أي نص عربي من النزول تحت حدّ المقروئية،
   دون أن تُضخّم العناوين الكبيرة (1em يبقى كما هو إن كان أكبر).
   Arabic: connected script — never letter-space; absolute floor via max(). */
html[data-lang="ar"] .t-ar,
html[data-lang="ar"] .ar-font,
html[data-lang="ar"] [lang="ar"]{
  font-family:'IBM Plex Arabic',system-ui,sans-serif !important;
  letter-spacing:normal !important;
  word-spacing:normal !important;
  text-transform:none !important;
  font-size:max(1.02rem,1em);
  line-height:1.85;
}
/* عناصر الواجهة الصغيرة: أرضية أعلى قليلاً + وزن أوضح */

  text-transform:none !important;

  line-height:1.8;
}
/* أزرار وروابط: مساحة نقر مريحة */

var QUOTES = [{"en": "Every letter carries the weight of a thousand silent hands before it.", "ar": "كل حرف يحمل ثقل ألف يد صامتة سبقته."}, {"en": "I do not draw the letter — I listen to where it wants to bend.", "ar": "لا أرسم الحرف — أصغي إلى حيث يريد أن ينحني."}, {"en": "The blank page is not empty. It is waiting, the way silence waits for a voice.", "ar": "الصفحة البيضاء ليست فارغة — إنها تنتظر، كما ينتظر الصمت صوتاً."}, {"en": "Ink remembers every hand that ever held it.", "ar": "الحبر يتذكر كل يد حملته يوماً."}, {"en": "A single dot, multiplied by patience, becomes a civilization.", "ar": "نقطة واحدة، مضروبة بالصبر، تصبح حضارة."}, {"en": "I write to slow down time — each stroke is a held breath.", "ar": "أكتب لأبطئ الزمن — كل ضربة قلم نَفَس محبوس."}, {"en": "The letter that bends the most is often the one that stands the longest.", "ar": "الحرف الأشد انحناءً غالباً هو الأطول بقاءً."}];
var PAGE_SIZE = 7;
var revealedCounts = {};

function buildQuotes(){
  var stage = document.getElementById('breath-stage');
  var dots = document.getElementById('breath-dots');
  QUOTES.forEach(function(q, i){
    var item = document.createElement('div');
    item.className = 'q-item' + (i===0 ? ' vis' : '');
    item.innerHTML = '<p class="q-text">&ldquo;' + q.en + '&rdquo;</p>' +
      '<p class="q-text-ar">&laquo;' + q.ar + '&raquo;</p>' +
      '<span class="q-author"><span class="t-en">Altayeb Amer</span><span class="t-ar name-ar">الطيب عامر</span></span>';
    stage.appendChild(item);
    var dot = document.createElement('div');
    dot.className = 'qdot' + (i===0 ? ' on' : '');
    dots.appendChild(dot);
  });
  var items = stage.querySelectorAll('.q-item');
  var qdots = dots.querySelectorAll('.qdot');
  var qi = 0;
  setInterval(function(){
    items[qi].classList.remove('vis');
    qdots[qi].classList.remove('on');
    qi = (qi+1) % items.length;
    items[qi].classList.add('vis');
    qdots[qi].classList.add('on');
  }, 6000);
}

function buildSections(){
  var container = document.createElement('div');
  SECTION_DATA.sections.forEach(function(sec, idx){
    revealedCounts[sec.id] = PAGE_SIZE;

    var sectionEl = document.createElement('section');
    sectionEl.className = 'gsection';
    sectionEl.id = sec.id;
    sectionEl.setAttribute('data-section', sec.id);

    var head = document.createElement('div');
    head.className = 'gsection-head';
    head.innerHTML = '<div class="gsection-num">' + (idx+1) + '</div>' +
      '<div><div class="gsection-title-en">' + sec.en + '</div><div class="gsection-title-ar">' + sec.ar + '</div></div>' +
      '<div class="gsection-count">' + sec.images.length + ' <span class="t-en">images</span><span class="t-ar">صورة</span></div>';

    var grid = document.createElement('div');
    grid.className = 'ggrid';
    grid.id = 'grid-' + sec.id;

    var moreWrap = document.createElement('div');
    moreWrap.className = 'gsection-more';
    var moreBtn = document.createElement('button');
    moreBtn.textContent = 'Show More (' + sec.images.length + ')';
    moreBtn.onclick = function(){ revealMore(sec.id); };
    moreWrap.appendChild(moreBtn);

    sectionEl.appendChild(head);
    sectionEl.appendChild(grid);
    sectionEl.appendChild(moreWrap);
    container.appendChild(sectionEl);

    renderGrid(sec.id);
  });
  document.body.insertBefore(container, document.getElementById('final-sg'));
}

function renderGrid(sectionId){
  var sec = SECTION_DATA.sections.find(function(s){ return s.id === sectionId; });
  if(!sec) return;
  var grid = document.getElementById('grid-' + sectionId);
  var count = revealedCounts[sectionId];
  var shown = sec.images.slice(0, count);
  grid.innerHTML = shown.map(function(url, i){
    return '<div class="gitem"><img src="' + url + '" loading="lazy" alt="' + sec.en + ' ' + (i+1) + '"></div>';
  }).join('');

  var moreBtn = grid.parentElement.querySelector('.gsection-more button');
  if(count >= sec.images.length){
    moreBtn.disabled = true;
    moreBtn.textContent = 'All Shown';
  } else {
    moreBtn.disabled = false;
    moreBtn.textContent = 'Show More (' + (sec.images.length - count) + ' left)';
  }
}

function revealMore(sectionId){
  revealedCounts[sectionId] = Math.min(revealedCounts[sectionId] + PAGE_SIZE, 999);
  renderGrid(sectionId);
}

function buildFilterButtons(){
  var bar = document.getElementById('filter-bar');
  SECTION_DATA.sections.forEach(function(sec){
    var btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.setAttribute('data-filter', sec.id);
    btn.innerHTML = '<span class="t-en">' + sec.en + '</span><span class="t-ar">' + sec.ar + '</span>';
    bar.appendChild(btn);
  });
  bar.addEventListener('click', function(e){
    var btn = e.target.closest('.filter-btn');
    if(!btn) return;
    bar.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    var filter = btn.getAttribute('data-filter');
    document.querySelectorAll('.gsection').forEach(function(sec){
      sec.style.display = (filter === 'all' || sec.id === filter) ? '' : 'none';
    });
    if(filter !== 'all'){
      var target = document.getElementById(filter);
      if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
    }
  });
}

// Hero slideshow rotation
(function(){
  var slides = document.querySelectorAll('#shero .slide');
  var idx = 0;
  setInterval(function(){
    slides[idx].classList.remove('active');
    idx = (idx+1) % slides.length;
    slides[idx].classList.add('active');
  }, 5000);
})();

buildQuotes();
buildFilterButtons();
buildSections();
</script>

  var blob=document.getElementById('ink-blob'),d=document.documentElement;

  var lang=(window.__AA_LANG||'en');

        d.setAttribute('dir',lang==='ar'?'rtl':'ltr');

        blob.classList.remove('grow');blob.classList.add('shrink');

      },480);
    });});

<script>
/* ── Lazy Loading للخلفيات (CSS backgrounds لا تدعم loading="lazy") ── */
(function(){
  var lazyBg = document.querySelectorAll('[data-bg]');
  if(!lazyBg.length) return;
  function load(el){
    var u = el.getAttribute('data-bg');
    if(!u) return;
    var img = new Image();
    img.onload = function(){ el.style.backgroundImage = "url('" + u + "')"; el.removeAttribute('data-bg'); };
    img.src = u;
  }
  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){ if(e.isIntersecting){ load(e.target); io.unobserve(e.target); } });
    }, {rootMargin:'300px 0px'});
    lazyBg.forEach(function(el){ io.observe(el); });
  } else { lazyBg.forEach(load); }
  window.addEventListener('load', function(){
    setTimeout(function(){ document.querySelectorAll('.slide[data-bg]').forEach(load); }, 400);
  });
})();
</script>

<script>
/* حفظ اللغة + تمريرها عبر الروابط (يعمل حتى على file:// حيث يُعزل localStorage) */
(function(){
  var d=document.documentElement;
  var g=document.getElementById("lang-glyph");
  function cur(){return d.getAttribute("data-lang")||"en";}
  if(g) g.textContent = cur()==="ar" ? "A" : "ض";
  function save(){ try{ localStorage.setItem("aa_lang",cur()); }catch(e){} }
  save();
  try{ new MutationObserver(save).observe(d,{attributes:true,attributeFilter:["data-lang"]}); }catch(e){}
  /* مرّر اللغة في كل رابط داخلي */
  document.addEventListener("click",function(e){
    var a=e.target.closest && e.target.closest("a[href]");
    if(!a) return;
    var h=a.getAttribute("href")||"";
    if(/^(https?:|mailto:|tel:|#|javascript:)/i.test(h)) return;
    if(a.target==="_blank") return;
    var l=cur();
    var hash=""; var base=h;
    var hi=h.indexOf("#"); if(hi>=0){ base=h.slice(0,hi); hash=h.slice(hi); }
    base=base.replace(/([?&])lang=(ar|en)&?/,"$1").replace(/[?&]$/,"");
    base += (base.indexOf("?")>=0?"&":"?")+"lang="+l;
    a.setAttribute("href",base+hash);
  },true);
})();
</script>
