/* ═══ ARABIC TYPOGRAPHY FIX v2 ═══
   العربية خط متّصل: لا تباعد حروف، ولا Uppercase، وخط عربي حقيقي.
   الأرضية المطلقة max() تمنع أي نص عربي من النزول تحت حدّ المقروئية،
   دون أن تُضخّم العناوين الكبيرة (1em يبقى كما هو إن كان أكبر).
   Arabic: connected script — never letter-space; absolute floor via max(). */
html[data-lang="ar"] .t-ar,
html[data-lang="ar"] .ar-font,
html[data-lang="ar"] [lang="ar"]{
  font-family:'IBM Plex Arabic',system-ui,sans-serif !important;
  letter-spacing:normal !important;
  word-spacing:normal !important;
  text-transform:none !important;
  font-size:max(1.02rem,1em);
  line-height:1.85;
}
/* عناصر الواجهة الصغيرة: أرضية أعلى قليلاً + وزن أوضح */

html[data-lang="ar"] .tag,html[data-lang="ar"] .page-tag,html[data-lang="ar"] .band-tag,

html[data-lang="ar"] .q-author,html[data-lang="ar"] .q-author-ar,

}
/* أزرار وروابط: مساحة نقر مريحة */

function buildBreathQuotes(){
  var stage = document.getElementById('breath-stage');
  var dots = document.getElementById('breath-dots');
  GENERAL_QUOTES.forEach(function(q, i){
    var item = document.createElement('div');
    item.className = 'q-item' + (i===0 ? ' vis' : '');
    item.innerHTML = '<p class="q-text">&ldquo;' + q.en + '&rdquo;</p>' +
      '<p class="q-text-ar">&laquo;' + q.ar + '&raquo;</p>' +
      '<span class="q-author"><span class="t-en">Altayeb Amer</span><span class="t-ar name-ar">الطيب عامر</span></span>';
    stage.appendChild(item);
    var dot = document.createElement('div');
    dot.className = 'qdot' + (i===0 ? ' on' : '');
    dots.appendChild(dot);
  });
  var items = stage.querySelectorAll('.q-item');
  var qdots = dots.querySelectorAll('.qdot');
  var qi = 0;
  setInterval(function(){
    items[qi].classList.remove('vis');
    qdots[qi].classList.remove('on');
    qi = (qi+1) % items.length;
    items[qi].classList.add('vis');
    qdots[qi].classList.add('on');
  }, 6000);
}

(function(){
  var slides = document.querySelectorAll('#hero-g .slide');
  var idx = 0;
  setInterval(function(){
    slides[idx].classList.remove('active');
    idx = (idx+1) % slides.length;
    slides[idx].classList.add('active');

function buildFilterButtons(){
  var bar = document.getElementById('filter-bar');
  GALLERY_DATA.forEach(function(spec){
    var btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.setAttribute('data-filter', spec.id);
    btn.innerHTML = '<span class="t-en">' + spec.en + '</span><span class="t-ar">' + spec.ar + '</span>';
    bar.appendChild(btn);
  });
  bar.addEventListener('click', function(e){
    var btn = e.target.closest('.filter-btn');
    if(!btn) return;
    bar.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    var filter = btn.getAttribute('data-filter');
    document.querySelectorAll('.specblock').forEach(function(block){
      block.style.display = (filter === 'all' || block.id === 'spec-' + filter) ? '' : 'none';
    });
  });
}

function buildSpecBlocks(){
  var container = document.createElement('div');
  GALLERY_DATA.forEach(function(spec){
    var block = document.createElement('section');
    block.className = 'specblock';
    block.id = 'spec-' + spec.id;

    var head = document.createElement('div');
    head.className = 'specblock-head';
    head.innerHTML =
      '<div class="specblock-num" style="color:' + spec.acc + '">' + spec.num + '</div>' +
      '<div><div class="specblock-title-en">' + spec.en + '</div><div class="specblock-title-ar">' + spec.ar + '</div></div>' +
      '<div class="specblock-links">' +
      '<a href="../' + spec.id + '/index.html" class="specblock-visit" style="color:' + spec.acc + '">' +
      '<span class="t-en">Visit ' + spec.en + '</span><span class="t-ar">زيارة ' + spec.ar + '</span></a>' +
      '<a href="../gallery/' + spec.sub_gallery + '/index.html" class="specblock-viewall" style="color:' + spec.acc + '">' +
      '<span class="t-en">View All 343</span><span class="t-ar">عرض الكل (٣٤٣)</span></a>' +
      '</div>';
    block.appendChild(head);

    spec.sections.forEach(function(sec){
      var sub = document.createElement('div');
      sub.className = 'gsubsection';
      var subHead = document.createElement('div');
      subHead.className = 'gsubsection-head';
      subHead.innerHTML = '<span class="gsubsection-title t-en">' + sec.en + '</span><span class="gsubsection-title t-ar">' + sec.ar + '</span>';
      var grid = document.createElement('div');
      grid.className = 'ggrid';
      grid.innerHTML = sec.sample_images.map(function(url, i){
        return '<div class="gitem"><img src="' + url + '" loading="lazy" alt="' + sec.en + ' ' + (i+1) + '"></div>';
      }).join('');
      sub.appendChild(subHead);
      sub.appendChild(grid);
      block.appendChild(sub);
    });

    container.appendChild(block);
  });
  document.body.insertBefore(container, document.getElementById('final-g'));
}

buildBreathQuotes();
buildFilterButtons();
buildSpecBlocks();

<script>
(function(){
  var btn=document.getElementById('lang-btn'),glyph=document.getElementById('lang-glyph');
  var blob=document.getElementById('ink-blob'),d=document.documentElement;
  if(!btn)return;
  var lang=(window.__AA_LANG||'en');
  glyph.textContent=lang==='ar'?'A':'ض';
  btn.addEventListener('click',function(e){
    e.stopPropagation();
    var r=btn.getBoundingClientRect();
    blob.style.left=(r.left+r.width/2)+'px';blob.style.top=(r.top+r.height/2)+'px';
    blob.style.transition='none';blob.style.transform='translate(-50%,-50%) scale(0)';
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      blob.classList.add('grow');
      setTimeout(function(){
        lang=lang==='en'?'ar':'en';
        d.setAttribute('data-lang',lang);d.setAttribute('lang',lang);
        d.setAttribute('dir',lang==='ar'?'rtl':'ltr');
        glyph.textContent=lang==='en'?'ض':'A';
        blob.classList.remove('grow');blob.classList.add('shrink');
        setTimeout(function(){blob.classList.remove('shrink');blob.style.transform='translate(-50%,-50%) scale(0)';},750);
      },480);
    });});
  });
})();
</script>

<script>
/* ── Lazy Loading للخلفيات ── */
(function(){
  var lazyBg = document.querySelectorAll('[data-bg]');
  if(!lazyBg.length) return;
  function load(el){
    var u = el.getAttribute('data-bg'); if(!u) return;
    var img = new Image();
    img.onload = function(){ el.style.backgroundImage = "url('" + u + "')"; el.removeAttribute('data-bg'); };
    img.src = u;
  }
  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ load(e.target); io.unobserve(e.target); } });
    }, {rootMargin:'300px 0px'});
    lazyBg.forEach(function(el){ io.observe(el); });
  } else { lazyBg.forEach(load); }
  window.addEventListener('load', function(){
    setTimeout(function(){ document.querySelectorAll('.slide[data-bg]').forEach(load); }, 400);
  });
})();
</script>

<script>
/* حفظ اللغة + تمريرها عبر الروابط (يعمل حتى على file:// حيث يُعزل localStorage) */
(function(){
  var d=document.documentElement;
  var g=document.getElementById("lang-glyph");
  function cur(){return d.getAttribute("data-lang")||"en";}
  if(g) g.textContent = cur()==="ar" ? "A" : "ض";
  function save(){ try{ localStorage.setItem("aa_lang",cur()); }catch(e){} }
  save();
  try{ new MutationObserver(save).observe(d,{attributes:true,attributeFilter:["data-lang"]}); }catch(e){}
  /* مرّر اللغة في كل رابط داخلي */
  document.addEventListener("click",function(e){
    var a=e.target.closest && e.target.closest("a[href]");
    if(!a) return;
    var h=a.getAttribute("href")||"";
    if(/^(https?:|mailto:|tel:|#|javascript:)/i.test(h)) return;
    if(a.target==="_blank") return;
    var l=cur();
    var hash=""; var base=h;
    var hi=h.indexOf("#"); if(hi>=0){ base=h.slice(0,hi); hash=h.slice(hi); }
    base=base.replace(/([?&])lang=(ar|en)&?/,"$1").replace(/[?&]$/,"");
    base += (base.indexOf("?")>=0?"&":"?")+"lang="+l;
    a.setAttribute("href",base+hash);
  },true);
})();
</script>
