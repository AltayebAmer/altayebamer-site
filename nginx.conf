server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Clean URLs: /gallery/ai/  ->  /gallery/ai/index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Correct MIME types (mirrors Cloudflare _headers)
    types {
        text/html                 html;
        application/json          json;
        application/javascript    js;
        image/svg+xml             svg;
        image/jpeg                jpg jpeg;
        image/png                 png;
        image/webp                webp;
    }

    # Block the CMS from being served in test, like robots.txt intends
    location = /altayeb-cms-v5.html {
        add_header X-Robots-Tag "noindex, nofollow";
    }

    # No caching while testing so image swaps show immediately
    add_header Cache-Control "no-store";
}
